[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pathtrace"
version = "1.1.0"
description = "Tests d'intégration pour les chemins d'orchestration des agents IA."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pathtrace = "pathtrace.cli:cli"

[tool.setuptools.packages.find]
include = ["pathtrace*"]
